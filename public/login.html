<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fermaja - admin dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/1.png" type="image/png">
</head>
<body>
  <section class="login-section">
    <div class="login-card">
      <div style="text-align:center;font-size:4rem;margin-bottom:10px;">🧀</div>
      <h2>لوحة التحكم</h2>
      <p class="sub">يرجى تسجيل الدخول للمتابعة</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" placeholder="admin" required />
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="login-btn">🚀 تسجيل الدخول</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </section>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');
      if (!username || !password) {
        errorEl.textContent = '⚠️ الرجاء ملء جميع الحقول';
        return;
      }
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        if (result.success) {
          sessionStorage.setItem('isLoggedIn', 'true');
          window.location.href = '/admin.html';
        } else {
          errorEl.textContent = '❌ ' + result.message;
        }
      } catch (err) {
        errorEl.textContent = '❌ خطأ في الاتصال بالخادم';
        console.error(err);
      }
    });
  </script>
</body>
</html>
